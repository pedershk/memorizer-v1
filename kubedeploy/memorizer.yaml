---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memorizer-config
  namespace: app-memorizer
data:
  ConnectionStrings__Storage: "Host=postgres;Port=5432;Database=postgmem;Username=postgres;Password=postgres"
  MEMORIZER_Embeddings__ApiUrl: "http://ollama:11434"
  MEMORIZER_Embeddings__Model: "all-minilm:33m-l12-v2-fp16"
  MEMORIZER_LLM__ApiUrl: "http://ollama:11434"
  MEMORIZER_LLM__Model: "qwen2:0.5b"
  MEMORIZER_LLM__Timeout: "00:02:00"
  MEMORIZER_LLM__Chunking__MinCharactersForChunking: "2000"
  MEMORIZER_LLM__Chunking__TargetChunkSize: "1500"
  MEMORIZER_Server__CanonicalUrl: "http://localhost:5000"
  ASPNETCORE_ENVIRONMENT: "Production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorizer
  namespace: app-memorizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memorizer
  template:
    metadata:
      labels:
        app: memorizer
    spec:
      containers:
      - name: memorizer
        image: petabridge/memorizer:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: memorizer-config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: memorizer
  namespace: app-memorizer
spec:
  selector:
    app: memorizer
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: LoadBalancer
