---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: app-memorizer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: app-memorizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: app-memorizer
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  type: ClusterIP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init
  namespace: app-memorizer
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: ollama-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: ollama-init
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo 'Waiting for Ollama service to start...'
          sleep 15

          echo 'Pulling embedding model...'
          for i in 1 2 3 4 5; do
            echo "Attempting to pull embedding model (try $i/5)..."
            if curl -s -X POST http://ollama:11434/api/pull -d '{"name": "all-minilm:33m-l12-v2-fp16"}'; then
              echo 'Embedding model pull initiated successfully'
              break
            fi
            echo 'Ollama not ready yet for embedding model, waiting...'
            sleep 10
          done

          echo 'Pulling lightweight LLM model...'
          for i in 1 2 3 4 5; do
            echo "Attempting to pull LLM model (try $i/5)..."
            if curl -s -X POST http://ollama:11434/api/pull -d '{"name": "qwen2:0.5b"}'; then
              echo 'LLM model pull initiated successfully'
              echo 'All models pulled successfully'
              exit 0
            fi
            echo 'Failed to pull LLM model, retrying...'
            sleep 10
          done
          echo 'Failed to pull models after multiple attempts'
          exit 1
