---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
  namespace: app-memorizer
data:
  PGADMIN_DEFAULT_EMAIL: "admin@example.com"
  PGADMIN_DEFAULT_PASSWORD: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: app-memorizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: pgadmin-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: app-memorizer
spec:
  selector:
    app: pgadmin
  ports:
  - port: 5050
    targetPort: 80
    name: http
  type: ClusterIP
